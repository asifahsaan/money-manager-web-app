# Local databases (optional — only needed if you use Docker instead of native installs)
#
#   docker compose up -d postgres   # local dev DB for the backend (DATABASE_URL)
#   docker compose up -d mysql      # local mirror of production (MIRROR_DATABASE_URL)

services:
  postgres:
    image: postgres:16
    container_name: money_manager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money_manager}
      POSTGRES_USER: ${POSTGRES_USER:-mmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmpassword}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: money_manager_mirror_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-money_manager_mirror}
      MYSQL_USER: ${MYSQL_USER:-mmuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mmpassword}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  postgres_data:
  mysql_data:
